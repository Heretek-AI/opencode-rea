name: Publish to npm (trusted publishing)

# OIDC trusted publishing: no long-lived npm token. Configure once at
# https://www.npmjs.com/package/@heretek-ai/opencode-rea/access
# (Trusted Publisher -> GitHub Actions -> Heretek-AI/opencode-rea,
# workflow publish.yml), then every published GitHub release ships to npm
# with provenance automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish via OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run check
      - name: Run unit tests
        run: bun test --path-ignore-patterns 'review/**' test/unit
      - name: Build plugin
        run: bun run build
      - name: Publish to npm
        run: npm publish --provenance --access public
